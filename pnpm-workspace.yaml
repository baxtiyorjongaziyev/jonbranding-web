packages:
  - .
  - services/portfolio-bot

allowBuilds:
  '@firebase/util': true
  bufferutil: false
  core-js: false
  es5-ext: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
  workerd: true

overrides:
  adm-zip@<0.6.0: '>=0.6.0'
  # Keep each major on its own line: minimatch@3 requires the v1 API, and
  # v5 renamed the export, so an unbounded '>=1.1.16' breaks ESLint with
  # "TypeError: expand is not a function". Upper bounds pin the fix per major.
  brace-expansion@<1.1.16: '>=1.1.18 <2'
  brace-expansion@>=2 <2.0.2: '>=2.0.2 <3'
  brace-expansion@>=3 <5.0.9: '>=5.0.9'
  js-yaml@<3.15.0: 3.15.0
  postcss@<8.5.10: 8.5.15
  postcss@<=8.5.17: '>=8.5.18'
  protobufjs@>=7.5.0 <=7.6.4: '>=7.6.5'
  sharp@<0.35.0: '>=0.35.0'
  smol-toml@<1.6.1: 1.6.1
  tar@<=7.5.20: '>=7.5.21'
  uuid@<11.1.1: 11.1.1
  valibot@<=1.4.1: '>=1.4.2'

recursiveInstall: false
