# Jon Branding — Universal Production Docker Compose
# Ishga tushirish: docker compose up -d --build
services:
  jonbranding-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jonbranding-web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
