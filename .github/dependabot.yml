version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tashkent
    # Routine version PRs are paused. Security updates remain enabled and are
    # grouped into one reviewable PR instead of creating a noisy queue.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci-cd
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
