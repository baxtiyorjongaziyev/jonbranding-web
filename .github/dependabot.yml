version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tashkent
    # Routine version PRs are paused. Security updates remain enabled and are
    # grouped into one reviewable PR instead of creating a noisy queue.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Next 16.4+ Cloudflare Free tarifida Worker'ni 10 ms CPU limitidan oshiradi
    # (production 500). Merge bo'lsa deploy avtomatik chiqadi — shu sabab to'xtatilgan.
    # Workers Paid'ga o'tilgach shu blokni olib tashlang (docs/KOCHISH.md).
    ignore:
      - dependency-name: "next"
        versions: [">=16.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci-cd
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
