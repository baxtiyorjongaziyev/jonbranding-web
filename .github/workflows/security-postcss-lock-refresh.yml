name: One-shot PostCSS security lock refresh

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lockfiles:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/postcss-8.5.23'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/postcss-8.5.23
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Match repository npm lockfile tooling
        run: npm install --global npm@11

      - name: Refresh npm and pnpm locks without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts
          pnpm install --lockfile-only --ignore-scripts

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfiles for PostCSS 8.5.23"
          git push origin HEAD:security/postcss-8.5.23
