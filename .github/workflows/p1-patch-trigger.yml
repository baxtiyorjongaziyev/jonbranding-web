name: Controlled P1 branch patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/p1_reliability_patch.py'
      - '.github/workflows/p1-patch-trigger.yml'

permissions:
  contents: write

jobs:
  patch:
    # One-shot job: exact commit message and exact target branch only.
    if: github.event.head_commit.message == 'chore(ci): trigger controlled P1 branch patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted control files
        uses: actions/checkout@v7
        with:
          ref: main
          path: control

      - name: Checkout exact target branch
        uses: actions/checkout@v7
        with:
          ref: p1/reliability-ci-monitoring
          path: target
          fetch-depth: 0

      - name: Apply trusted patch
        run: python control/scripts/p1_reliability_patch.py target

      - name: Commit target changes
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/submit-form/route.ts \
            next.config.js \
            package.json \
            playwright.config.ts \
            tests/example.spec.ts \
            .github/workflows/test.yml
          git commit -m "feat(p1): enforce reliable builds and delivery monitoring"
          git push origin HEAD:p1/reliability-ci-monitoring
