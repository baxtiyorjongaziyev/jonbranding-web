name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "34 4 * * 4"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      # Repo yopiq va Code scanning (GitHub Advanced Security) yoqilmagan — natija
      # GitHub'ga yuklanmaydi. Topilmalar SARIF faylda tekshiriladi va CI logida chiqadi.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results

      - name: Fail on CodeQL findings
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "codeql-results";
            let total = 0;
            for (const f of fs.readdirSync(dir).filter((n) => n.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              for (const run of sarif.runs || []) {
                for (const r of run.results || []) {
                  const loc = r.locations?.[0]?.physicalLocation;
                  const file = loc?.artifactLocation?.uri ?? "?";
                  const line = loc?.region?.startLine ?? "?";
                  console.log(`::error file=${file},line=${line}::${r.ruleId}: ${r.message?.text ?? ""}`);
                  total++;
                }
              }
            }
            console.log(`CodeQL topilmalari: ${total}`);
            process.exit(total > 0 ? 1 : 0);
          '

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results
          if-no-files-found: ignore
