name: CI - JonBranding-Web

# Ochiq (public) repo uchun bepul GitHub-hosted ubuntu-latest runner ishlatiladi.
# Bitta asosiy job, draft PR'da o'tkazib yuboriladi, main push'da faqat kod/konfig
# o'zgarganda ishlaydi. Oldingi 3 job (checks + build + gate) o'rniga bitta job:
# npm ci bir marta, gate job yo'q.
#
# Majburiy (branch protection) tekshiruv nomi "Typecheck, lint, test, build" —
# aynan shu nom bitta job'ga berilgan. Nomni o'zgartirmang.
# Draft PR'da job skipped bo'ladi: GitHub skipped majburiy tekshiruvni
# o'tgan deb hisoblaydi, shuning uchun draft merge'ni bloklamaydi.
# Ready for review'da (ready_for_review) to'liq CI ishlaydi.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'
      - 'tailwind.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    # PR'da paths filtri yo'q: aks holda hujjat-only PR'da majburiy tekshiruv
    # yaratilmaydi va merge bloklanadi. Draft PR'lar baribir o'tkazib yuboriladi.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Nom majburiy tekshiruv bilan bir xil bo'lishi shart (yuqoridagi izohga qarang).
  test:
    name: Typecheck, lint, test, build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      # Next.js inkremental build keshi — har safar noldan build qilmaslik uchun.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_OISHA_API_URL: ${{ secrets.NEXT_PUBLIC_OISHA_API_URL }}
          NEXT_TELEMETRY_DISABLED: '1'

  # E2E faqat main'ga push'da — PR'larni ~2 daqiqa kutdirmaslik uchun.
  e2e:
    name: Playwright Chromium E2E
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:9002
          NEXT_PUBLIC_SANITY_PROJECT_ID: h6ymmj0v
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_OISHA_API_URL: http://127.0.0.1:8080
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
