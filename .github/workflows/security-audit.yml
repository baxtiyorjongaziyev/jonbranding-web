name: Security Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Ketma-ket pushlarda eski run'ni to'xtatadi (kvota tejash).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    # Draft PR'da o'tkazib yuboriladi; ready_for_review'da qayta ishlaydi.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: |
          npm audit --audit-level=high --omit=dev --json > npm-audit.json || true
          node scripts/check-audit.mjs npm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
