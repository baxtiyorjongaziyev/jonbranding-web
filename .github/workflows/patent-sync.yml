# Google Drive `JonBranding/Patent` papkasidagi yangi guvohnomalarni saytga qo'shadi.
# Kerakli secrets: GDRIVE_SERVICE_ACCOUNT_JSON (service account kaliti, JSON),
# GDRIVE_FOLDER_ID (papka ID'si; papka service account email'iga "Viewer" sifatida ulashiladi).
# Batafsil: scripts/patent-sync/README.md
name: Patent sync (Google Drive)

on:
  schedule:
    - cron: '0 4 * * *' # har kuni 09:00 (Toshkent)
  workflow_dispatch: {}

concurrency:
  group: patent-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/patent-sync/requirements.txt

      - run: pip install -r scripts/patent-sync/requirements.txt

      - name: Drive'dan guvohnomalarni o'qish
        id: sync
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/patent-sync/sync.py

      # Faqat ma'lumot (JSON + rasm) o'zgaradi, lekin baribir tekshiramiz:
      # buzilgan JSON saytni yiqitmasin.
      - name: Tekshiruv (typecheck + kontent testlari)
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/lib

      - name: Commit va push (Vercel avtomatik deploy qiladi)
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "patent-sync[bot]"
          git config user.email "patent-sync@users.noreply.github.com"
          git add src/data/patent-certificates.json public/images/patent
          git commit -m "feat(patent): yangi guvohnoma Drive'dan" -m "$SUMMARY"
          git push

      - name: Hisobot
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          {
            echo "### Saytga qo'shildi"
            echo "$SUMMARY"
            echo
            echo "Brend nomi PDF matnida yo'q — kerak bo'lsa \`src/data/patent-certificates.json\` da \`brand\` ni to'ldiring."
          } >> "$GITHUB_STEP_SUMMARY"
