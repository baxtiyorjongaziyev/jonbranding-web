name: Cron — Universal production endpoints

# Hostingdan mustaqil universal cron tizimi (docs/KOCHISH.md).
# Vercel, Cloudflare, Docker yoki VPS bo'lishidan qat'i nazar,
# domen (https://www.jonbranding.uz) orqali fon vazifalarini uzluksiz ishga tushiradi.
# CRON_SECRET GitHub secret'i va serverdagi CRON_SECRET bir xil bo'lishi kerak.
on:
  schedule:
    - cron: '0 1 * * *'   # content-agent (01:00 UTC)
    - cron: '0 4 * * *'   # lead-retry (04:00 UTC)
    - cron: '0 9 * * *'   # portfolio-telegram (09:00 UTC)
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET secret'i yo'q — cron chaqirilmadi."
            exit 0
          fi
          case "$SCHEDULE" in
            "0 1 * * *") path=/api/content-agent ;;
            "0 4 * * *") path=/api/cron/lead-retry ;;
            "0 9 * * *") path=/api/portfolio-telegram ;;
            *) echo "Qo'lda ishga tushirildi — endpoint tanlanmagan."; exit 0 ;;
          esac
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "https://www.jonbranding.uz$path"
